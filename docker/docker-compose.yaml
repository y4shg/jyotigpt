# JyotiGPT — all-in-one compose
# A single container runs both the FastAPI backend (:8000, internal) and the
# Next.js web server (:3001, the origin you browse to). /api/* is proxied to
# the backend by the web server, so only port 3001 is published.
# Usage:
#   docker compose up -d          (build + start)
#   docker compose logs -f        (tail logs)
#   docker compose down           (stop + remove)

services:
  jyotigpt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - APP_ENV=production
      - DATA_DIR=/app/data
      - FRONTEND_ORIGINS=http://localhost:3001,http://localhost:3000
      - WEBUI_URL=http://localhost:3001
      # Add your provider keys here:
      # - OPENAI_API_KEY=
      - JYOTIGPT_JWT_SECRET_KEY=${JYOTIGPT_JWT_SECRET_KEY:-}
      - ENABLE_WEB_SEARCH=false
      # - SEARXNG_QUERY_URL=
      # - AUDIO_STT_ENGINE=
      # - AUDIO_TTS_ENGINE=
    volumes:
      - jyotigpt-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3001/api/v1/config').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 15s

volumes:
  jyotigpt-data:
