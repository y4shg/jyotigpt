# JyotiGPT — local development + production compose
# Usage:
#   docker compose up -d          (build + start)
#   docker compose logs -f api    (tail API logs)
#   docker compose down           (stop + remove)

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:///data/jyoti.db
      - FRONTEND_ORIGINS=http://localhost:3001,http://localhost:3000
      - WEBUI_URL=http://localhost:3001
      # Add your provider keys here:
      # - OPENAI_API_KEY=
      - JYOTIGPT_JWT_SECRET_KEY=${JYOTIGPT_JWT_SECRET_KEY:-}
      - ENABLE_WEB_SEARCH=false
      # - SEARXNG_QUERY_URL=
      # - AUDIO_STT_ENGINE=
      # - AUDIO_TTS_ENGINE=
    volumes:
      - api-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/config').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
