[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jyoti-api"
version = "0.1.0"
description = "JyotiGPT — self-hosted AI chat for the Brahma Kumaris community (API server)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.0",
    "PyJWT==2.13.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "aiosqlite==0.22.1",
    "aiofiles==25.1.0",
    "bcrypt==5.0.0",
    "ldap3==2.9.1",
    "pypdf==6.15.0",
    "python-docx==1.2.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.2"]

[tool.setuptools.packages.find]
include = ["jyoti_api*"]

[tool.setuptools.package-data]
jyoti_api = ["persistence/migrations/*.py", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
